name: data-verify

concurrency:
  group: grapegram-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: ["data/**", "scripts/**", "tests/**", "rust/**", "client/**", "backend/**", ".github/workflows/**"]
  pull_request:
    paths: ["data/**", "scripts/**", "tests/**", "rust/**", "client/**", "backend/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Test all Rust crates
        run: |
          set -euo pipefail
          for manifest in \
            rust/materializer/Cargo.toml \
            rust/badge-tools/Cargo.toml \
            rust/badge-service/Cargo.toml \
            rust/badge-jni/Cargo.toml; do
            echo "=== cargo test: $manifest ==="
            cargo test --release --manifest-path "$manifest"
          done
      - name: Owners are exactly the two project IDs
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/owner_users.json"))
          assert d["owners"] == ["7293365262", "960792706"], d
          assert all(isinstance(x, str) for x in d["owners"])
          print("owners ok")
          PY
      - name: Signature
        run: |
          for f in data/badge_users.json data/owner_users.json; do
            python3 scripts/verify_data.py "$f" "data/signatures/$(basename "$f").sig"
          done
