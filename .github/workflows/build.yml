name: build

concurrency:
  group: grapegram-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Badge assignments and audit history have their own verification workflow.
    # Do not rebuild the 30+ minute Android APK for each badge grant/revoke.
    paths-ignore:
      - "data/badge_users.json"
      - "data/owner_users.json"
      - "data/signatures/badge_users.json.sig"
      - "data/signatures/owner_users.json.sig"
      - "data/audit.jsonl"
      - "data/schemas/**"
      - "backend/**"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
      - "render.yaml"
  pull_request:
    paths-ignore:
      - "data/badge_users.json"
      - "data/owner_users.json"
      - "data/signatures/badge_users.json.sig"
      - "data/signatures/owner_users.json.sig"
      - "data/audit.jsonl"
      - "data/schemas/**"
      - "backend/**"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
      - "render.yaml"
  workflow_dispatch:

jobs:
  data:
    name: data + crypto tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify signatures
        run: |
          for f in data/badge_users.json data/owner_users.json; do
            python3 scripts/verify_data.py "$f" "data/signatures/$(basename "$f").sig"
          done

  rust:
    name: rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/materializer
            rust/badge-tools
            rust/badge-service
            rust/badge-jni
      - name: Check materializer
        run: cargo test --release --manifest-path rust/materializer/Cargo.toml
      - name: Check badge tools
        run: cargo test --release --manifest-path rust/badge-tools/Cargo.toml
      - name: Check badge service
        run: cargo test --release --manifest-path rust/badge-service/Cargo.toml
      - name: Check badge JNI
        run: cargo check --release --manifest-path rust/badge-jni/Cargo.toml

  apk:
    name: android build (signed)
    runs-on: ubuntu-latest
    needs: [data, rust]
    env:
      GRP_DATA_BASE: ${{ vars.GRP_DATA_BASE || 'https://raw.githubusercontent.com/kesakuuta/grapeGram/main/data/' }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
      BASE_COMMIT: 31a35e4683fb420ee782cdd32f36aea812bf756c
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/materializer
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: Secret scan
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----[\r\n][A-Za-z0-9+/=\r\n]{40,}"),
              re.compile(rb"ghp_[A-Za-z0-9]{20,}"),
              re.compile(rb"AIza[0-9A-Za-z_-]{30,}"),
          ]
          hits = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if any(p.search(data) for p in patterns):
                  hits.append(name)
          if hits:
              print("::error::secret-like material in: " + ", ".join(hits))
              sys.exit(1)
          print("secret scan: clean")
          PY
      - name: SDK packages (from base build.gradle)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Fetch pinned base with submodules
        run: |
          BASE="$RUNNER_TEMP/base"
          git init -q "$BASE"
          git -C "$BASE" remote add origin https://github.com/exteraless/exteraless.git
          git -C "$BASE" fetch --depth 1 -q origin "$BASE_COMMIT"
          git -C "$BASE" checkout -q --force FETCH_HEAD
          git -C "$BASE" submodule update --init --recursive --depth 1 || \
            git -C "$BASE" submodule update --init --recursive
      - name: Fetch pinned Cherrygram and exteraGram icon resources
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/base"
          fetch_sparse() {
            local repo="$1" commit="$2" dir="$3"
            shift 3
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/$repo.git"
            git -C "$dir" sparse-checkout init --cone
            git -C "$dir" sparse-checkout set "$@"
            git -C "$dir" fetch --filter=blob:none --depth 1 -q origin "$commit"
            git -C "$dir" checkout -q --force FETCH_HEAD
          }

          fetch_sparse arsLan4k1390/Cherrygram 9e1c901e6fbca5a9a346683b91c6d529376f5304 \
            "$RUNNER_TEMP/cherrygram-icons" TMessagesProj/src/main/res-cherrygram
          fetch_sparse exteraSquad/exteraGram b4d852f48f2734a0bee1a74a0939be621612262a \
            "$RUNNER_TEMP/exteragram-icons" \
            TMessagesProj/src/main/res-appicons \
            TMessagesProj/src/main/res/drawable \
            TMessagesProj/src/main/res/drawable-v31

          RES="$BASE/TMessagesProj/src/main/res"
          CG="$RUNNER_TEMP/cherrygram-icons/TMessagesProj/src/main/res-cherrygram"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cp "$CG"/drawable/icon_background_*.xml "$RES/drawable/"
          cp "$CG"/drawable/icon_foreground*.xml "$RES/drawable/"
          cp "$CG"/mipmap-anydpi-v26/icon_launcher_cherry*.xml "$RES/mipmap-anydpi-v26/"

          EG="$RUNNER_TEMP/exteragram-icons/TMessagesProj/src/main"
          cp -a "$EG/res-appicons/." "$RES/"
          cp "$EG"/res/drawable/ic_monochrome*.xml "$RES/drawable/"
          mkdir -p "$RES/drawable-v31"
          cp "$EG"/res/drawable-v31/ic_foreground_monet.xml "$RES/drawable-v31/"
          echo "Imported pinned Cherrygram and exteraGram adaptive icon assets"
      - name: Build Rust materializer
        run: cargo build --release --manifest-path rust/materializer/Cargo.toml
      - name: Materialise grapeGram (Rust overlay)
        env:
          GRP_ROOT: ${{ github.workspace }}
        run: |
          rust/materializer/target/release/grape-materializer \
            --root "$RUNNER_TEMP/base"
      - name: Verify identity patches
        run: |
          grep -q '^APP_PACKAGE=app.grapegram$' "$RUNNER_TEMP/base/gradle.properties"
          grep -q 'android:label="@string/AppName"' "$RUNNER_TEMP/base/TMessagesProj/src/main/AndroidManifest.xml"
          grep -q 'android:icon="@drawable/grape_icon_original"' "$RUNNER_TEMP/base/TMessagesProj/src/main/AndroidManifest.xml"
          grep -q '<string name="AppName">grapeGram</string>' "$RUNNER_TEMP/base/TMessagesProj/src/main/res/values/strings.xml"
          echo "identity: package=app.grapegram name=grapeGram icon=grape"
      - name: Install and validate release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is required"; exit 1; }
          test -n "$KEYSTORE_PASS" || { echo "KEYSTORE_PASS secret is required"; exit 1; }
          test -n "$ALIAS_NAME" || { echo "ALIAS_NAME secret is required"; exit 1; }
          test -n "$ALIAS_PASS" || { echo "ALIAS_PASS secret is required"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/base/TMessagesProj/release.keystore"
          test -s "$RUNNER_TEMP/base/TMessagesProj/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/base/TMessagesProj/release.keystore" \
            -storepass "$KEYSTORE_PASS" -alias "$ALIAS_NAME" > /dev/null
          echo "release signing credentials validated (secrets not printed)"
      - name: Chaquopy build python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
      - name: Release APK + AAB (signed)
        working-directory: ${{ runner.temp }}/base
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj:assembleRelease :TMessagesProj:bundleRelease \
            --no-daemon --stacktrace --warning-mode=all --build-cache 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"
      - name: Warning report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          log = os.path.join(os.environ['RUNNER_TEMP'], 'gradle.log')
          source = open(log, 'r', errors='replace').read() if os.path.exists(log) else ''
          records = []
          patterns = [
              ('Kotlin', re.compile(r'^w: (?P<file>.*?):(?P<line>\d+):(?P<column>\d+): (?P<message>.*)$')),
              ('C/C++', re.compile(r'^(?P<file>.*?):(?P<line>\d+):(?P<column>\d+): warning: (?P<message>.*)$')),
              ('Java', re.compile(r'^(?P<file>.*?\.java): warning: (?P<message>.*)$')),
              ('CMake', re.compile(r'^CMake (?:Deprecation )?Warning at (?P<file>.*?):(?P<line>\d+).*?: (?P<message>.*)$')),
              ('R8', re.compile(r'^(?:R8: )?Warning: (?P<message>.*)$')),
              ('Gradle', re.compile(r'^(?P<message>.*(?:was deprecated|has been deprecated|deprecated Gradle features).*)$')),
          ]
          for raw in source.splitlines():
              line = raw.strip()
              for category, pattern in patterns:
                  match = pattern.match(line)
                  if not match:
                      continue
                  item = match.groupdict()
                  file = item.get('file')
                  if file:
                      file = file.replace(os.environ.get('GITHUB_WORKSPACE', ''), '').lstrip('/')
                  if file and ('/app/grapegram/' in '/' + file or file.startswith('app/grapegram/')):
                      origin, status = 'grapeGram', 'needs-fix-or-review'
                  elif file and any(name in file for name in (
                      'org/telegram/ui/Cells/DialogCell.java',
                      'org/telegram/ui/Components/ChatAvatarContainer.java',
                      'org/telegram/ui/ProfileActivity.java',
                      'org/telegram/ui/Cells/UserCell.java',
                      'org/telegram/ui/ThemeActivity.java',
                      'app/exteraless/settings/OpenExteraChatsActivity.java',
                      'app/exteraless/ai/AiConfig.java',
                      'tw/nekomimi/nekogram/translate/source/GoogleTranslator.kt',
                      'app/exteraless/plugins/ui/PluginsActivity.java')):
                      origin, status = 'upstream file patched by grapeGram', 'review-patched-upstream'
                  elif file and ('/jni/third_party/' in '/' + file or '/jni/voip/' in '/' + file or '/jni/tgcalls/' in '/' + file):
                      origin, status = 'third-party/upstream dependency', 'review-only-no-bulk-edit'
                  elif category in ('CMake', 'Gradle', 'R8'):
                      origin, status = 'build tooling', 'review-tooling'
                  else:
                      origin, status = 'upstream', 'review-upstream'
                  records.append({
                      'category': category, 'file': file,
                      'line': int(item['line']) if item.get('line') else None,
                      'column': int(item['column']) if item.get('column') else None,
                      'message': item.get('message', line),
                      'origin': origin, 'status': status, 'raw': line
                  })
                  break
          unique = {}
          for item in records:
              key = (item['category'], item['file'], item['line'], item['message'])
              unique[key] = item
          report = {'total_warning_lines': len(records), 'unique_warnings': len(unique),
                    'warnings': list(unique.values())}
          out_dir = os.path.join(os.environ['RUNNER_TEMP'], 'warning-report')
          os.makedirs(out_dir, exist_ok=True)
          with open(os.path.join(out_dir, 'warning-report.json'), 'w') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          md = [
              '## Gradle warning report', '',
              f"- Warning lines: **{len(records)}**",
              f"- Unique warnings: **{len(unique)}**", '',
              '| Category | Origin | File | Line | Status | Warning |',
              '|---|---|---|---:|---|---|'
          ]
          for item in unique.values():
              message = item['message'].replace('|', '\\|')
              md.append('| {category} | {origin} | {file} | {line} | {status} | {message} |'.format(
                  category=item['category'], origin=item['origin'],
                  file=item['file'] or '—', line=item['line'] or '—',
                  status=item['status'], message=message))
          markdown = '\n'.join(md) + '\n'
          with open(os.path.join(out_dir, 'warning-report.md'), 'w') as f:
              f.write(markdown)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as f:
                  f.write(markdown)
          print(markdown)
          PY
      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: warn
      - name: Name and verify signed artifacts
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, shutil, subprocess, zipfile
          temp = os.environ['RUNNER_TEMP']
          base = os.path.join(temp, 'base/TMessagesProj/build/outputs')
          apks = glob.glob(os.path.join(base, 'apk/release/*.apk'))
          aabs = glob.glob(os.path.join(base, 'bundle/release/*.aab'))
          if len(apks) != 1:
              raise SystemExit(f'expected exactly one release APK, found {len(apks)}')
          if len(aabs) != 1:
              raise SystemExit(f'expected exactly one release AAB, found {len(aabs)}')
          out = os.path.join(temp, 'artifacts')
          os.makedirs(out, exist_ok=True)
          apk = os.path.join(out, 'grapeGram-release.apk')
          aab = os.path.join(out, 'grapeGram-release.aab')
          shutil.copy2(apks[0], apk)
          shutil.copy2(aabs[0], aab)
          if os.path.getsize(apk) < 1024 * 1024 or os.path.getsize(aab) < 1024 * 1024:
              raise SystemExit('release artifact is unexpectedly small')
          sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          apksigner = os.path.join(sdk, 'build-tools', '36.0.0', 'apksigner')
          subprocess.run([apksigner, 'verify', '--verbose', '--print-certs', apk], check=True)
          subprocess.run(['jarsigner', '-verify', '-verbose', '-certs', aab], check=True)
          with zipfile.ZipFile(aab) as archive:
              names = archive.namelist()
              if not any(n.startswith('META-INF/') and n.rsplit('.', 1)[-1] in ('RSA', 'DSA', 'EC') for n in names):
                  raise SystemExit('AAB has no JAR signature block')
              if not any(n.startswith('META-INF/') and n.endswith('.SF') for n in names):
                  raise SystemExit('AAB has no JAR signature manifest')
          for path in (apk, aab):
              digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              print(f'{os.path.basename(path)} sha256:{digest} size:{os.path.getsize(path)}')
          PY
      - name: Upload warning report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: warning-report
          path: \${{ runner.temp }}/warning-report/*
          if-no-files-found: warn
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grapeGram-signed
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
