name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:

jobs:
  data:
    name: data + crypto tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify signatures
        run: |
          for f in data/badge_users.json data/owner_users.json; do
            python3 scripts/verify_data.py "$f" "data/signatures/$(basename "$f").sig"
          done

  rust:
    name: rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/materializer
            rust/badge-tools
            rust/badge-service
            rust/badge-jni
      - name: Check materializer
        run: cargo test --release --manifest-path rust/materializer/Cargo.toml
      - name: Check badge tools
        run: cargo test --release --manifest-path rust/badge-tools/Cargo.toml
      - name: Check badge service
        run: cargo test --release --manifest-path rust/badge-service/Cargo.toml
      - name: Check badge JNI
        run: cargo check --release --manifest-path rust/badge-jni/Cargo.toml

  apk:
    name: android build (signed)
    runs-on: ubuntu-latest
    needs: [data, rust]
    env:
      GRP_DATA_BASE: ${{ vars.GRP_DATA_BASE || 'https://raw.githubusercontent.com/kesakuuta/grapeGram/main/data/' }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
      BASE_COMMIT: 31a35e4683fb420ee782cdd32f36aea812bf756c
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/materializer
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: Secret scan
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----[\r\n][A-Za-z0-9+/=\r\n]{40,}"),
              re.compile(rb"ghp_[A-Za-z0-9]{20,}"),
              re.compile(rb"AIza[0-9A-Za-z_-]{30,}"),
          ]
          hits = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if any(p.search(data) for p in patterns):
                  hits.append(name)
          if hits:
              print("::error::secret-like material in: " + ", ".join(hits))
              sys.exit(1)
          print("secret scan: clean")
          PY
      - name: SDK packages (from base build.gradle)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Fetch pinned base with submodules
        run: |
          BASE="$RUNNER_TEMP/base"
          git init -q "$BASE"
          git -C "$BASE" remote add origin https://github.com/exteraless/exteraless.git
          git -C "$BASE" fetch --depth 1 -q origin "$BASE_COMMIT"
          git -C "$BASE" checkout -q --force FETCH_HEAD
          git -C "$BASE" submodule update --init --recursive --depth 1 || \
            git -C "$BASE" submodule update --init --recursive
      - name: Build Rust materializer
        run: cargo build --release --manifest-path rust/materializer/Cargo.toml
      - name: Materialise grapeGram (Rust overlay)
        env:
          GRP_ROOT: ${{ github.workspace }}
        run: |
          rust/materializer/target/release/grape-materializer \
            --root "$RUNNER_TEMP/base"
      - name: Verify identity patches
        run: |
          grep -q '^APP_PACKAGE=app.grapegram$' "$RUNNER_TEMP/base/gradle.properties"
          grep -q 'android:label="@string/AppName"' "$RUNNER_TEMP/base/TMessagesProj/src/main/AndroidManifest.xml"
          grep -q 'android:icon="@drawable/grape_icon_original"' "$RUNNER_TEMP/base/TMessagesProj/src/main/AndroidManifest.xml"
          grep -q '<string name="AppName">grapeGram</string>' "$RUNNER_TEMP/base/TMessagesProj/src/main/res/values/strings.xml"
          echo "identity: package=app.grapegram name=grapeGram icon=grape"
      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/base/TMessagesProj/release.keystore"
          test -s "$RUNNER_TEMP/base/TMessagesProj/release.keystore"
          echo "release keystore installed (not committed)"
      - name: Chaquopy build python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
      - name: Release APK + AAB (signed)
        working-directory: ${{ runner.temp }}/base
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj:assembleRelease :TMessagesProj:bundleRelease \
            --no-daemon --stacktrace --warning-mode=all --build-cache 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"
      - name: Warning report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          log = os.path.join(os.environ['RUNNER_TEMP'], 'gradle.log')
          if not os.path.exists(log):
              raise SystemExit(0)
          text = open(log, 'r', errors='replace').read()
          groups = {
              'Groovy DSL deprecations': r"was deprecated.*|deprecated.*Groovy",
              'Java source/target': r"source value 8|target value 8|source/target",
              'Kotlin warnings': r"^w: ",
              'CMake warnings': r"CMake Warning|CMake Deprecation",
              'C/C++ warnings': r"warning: ",
              'R8 warnings': r"^Warning:.*R8|R8:",
          }
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          lines = ['## Gradle warning report', '']
          for name, pat in groups.items():
              n = len(re.findall(pat, text, re.MULTILINE))
              lines.append(f'- **{name}**: {n}')
          lines.append('')
          lines.append('Full log uploaded as artifact `gradle-log`.')
          out = '\n'.join(lines) + '\n'
          print(out)
          if summary:
              with open(summary, 'a') as fh:
                  fh.write(out)
          PY
      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: warn
      - name: Name artifacts grapeGram
        run: |
          python3 - <<'PY'
          import glob, os, shutil
          temp = os.environ['RUNNER_TEMP']
          out = os.path.join(temp, 'artifacts')
          os.makedirs(out, exist_ok=True)
          patterns = [
              os.path.join(temp, 'base/TMessagesProj/build/outputs/apk/release/*.apk'),
              os.path.join(temp, 'base/TMessagesProj/build/outputs/bundle/release/*.aab'),
          ]
          count = 0
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  base = os.path.basename(path)
                  if base.endswith('.aab'):
                      base = 'grapeGram-release.aab'
                  elif not base.startswith('grapeGram'):
                      base = 'grapeGram-' + base
                  dst = os.path.join(out, base)
                  shutil.copy2(path, dst)
                  print('artifact:', os.path.basename(dst))
                  count += 1
          if count < 2:
              raise SystemExit('expected release APK and AAB, got %d' % count)
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grapeGram-signed
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
