name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data:
    name: data + crypto tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify signatures
        run: |
          for f in data/badge_users.json data/owner_users.json; do
            python3 scripts/verify_data.py "$f" "data/signatures/$(basename "$f").sig"
          done

  apk:
    name: android build
    runs-on: ubuntu-latest
    needs: data
    env:
      GRP_DATA_BASE: ${{ vars.GRP_DATA_BASE || 'https://raw.githubusercontent.com/OWNER/grapeGram/main/data/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
      - name: SDK packages (from base build.gradle)
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Materialise grapeGram (base + overlay)
        run: python3 client/apply.py --root "$RUNNER_TEMP/base" --download
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true
      - name: Chaquopy build python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
      - name: Debug APK
        working-directory: ${{ runner.temp }}/base
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon --stacktrace
      - name: Release APK + AAB
        working-directory: ${{ runner.temp }}/base
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj:assembleRelease :TMessagesProj:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: grapeGram-apk
          path: |
            ${{ runner.temp }}/base/TMessagesProj/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/base/TMessagesProj/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
