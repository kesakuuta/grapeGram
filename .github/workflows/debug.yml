name: debug

on:
  workflow_dispatch:

jobs:
  debug-apk:
    name: debug APK
    runs-on: ubuntu-latest
    env:
      GRP_DATA_BASE: ${{ vars.GRP_DATA_BASE || 'https://raw.githubusercontent.com/kesakuuta/grapeGram/main/data/' }}
      BASE_COMMIT: 31a35e4683fb420ee782cdd32f36aea812bf756c
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/materializer
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: SDK packages (from base build.gradle)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Fetch pinned base with submodules
        run: |
          BASE="$RUNNER_TEMP/base"
          git init -q "$BASE"
          git -C "$BASE" remote add origin https://github.com/exteraless/exteraless.git
          git -C "$BASE" fetch --depth 1 -q origin "$BASE_COMMIT"
          git -C "$BASE" checkout -q --force FETCH_HEAD
          git -C "$BASE" submodule update --init --recursive --depth 1 || \
            git -C "$BASE" submodule update --init --recursive
      - name: Build Rust materializer
        run: cargo build --release --manifest-path rust/materializer/Cargo.toml
      - name: Materialise grapeGram (Rust overlay)
        env:
          GRP_ROOT: ${{ github.workspace }}
        run: |
          rust/materializer/target/release/grape-materializer \
            --root "$RUNNER_TEMP/base"
      - name: Chaquopy build python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
      - name: Debug APK
        working-directory: ${{ runner.temp }}/base
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon --stacktrace --warning-mode=all --build-cache
      - name: Name artifact
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$RUNNER_TEMP"/base/TMessagesProj/build/outputs/apk/debug/*.apk \
             "$RUNNER_TEMP/artifacts/grapeGram-debug.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: grapeGram-debug
          path: ${{ runner.temp }}/artifacts/grapeGram-debug.apk
          if-no-files-found: error
